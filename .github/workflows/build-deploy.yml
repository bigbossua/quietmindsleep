name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - run: npm run linkmap && npm run register
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports

      # Option A (recommended): publish dist/ to the `hostinger` branch. In Hostinger hPanel → Websites → Advanced → Git,
      # connect this repository, branch `hostinger`, directory `public_html`. Hostinger pulls plain files; no build step there.
      - name: Publish built site to hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"

      # Option B: direct FTP/FTPS upload to Hostinger. Add repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      # (Hostinger hPanel → Files → FTP Accounts). The step is skipped when the secrets are absent.
      - name: Check FTP secrets
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: echo "enabled=$([ -n "$FTP_SERVER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy via FTP
        if: steps.ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
