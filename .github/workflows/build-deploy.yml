name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ssh_enabled: ${{ steps.ssh.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - run: npm run linkmap && npm run register
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports

      # Always publish dist/ to the `hostinger` branch (Hostinger Git deployment can pull it; no keys needed for a public repo).
      - name: Publish built site to hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"

      - name: Check SSH deploy secrets
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Reports presence only; secret values are never printed.
          missing=""
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "SSH deploy: all required secrets present"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SSH deploy: skipped. Missing repository secrets:$missing (optional: SSH_PORT default 65002, SSH_TARGET_DIR default domains/quietmindsleep.co.uk/public_html)"
            echo "### SSH deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them in Settings → Secrets and variables → Actions (see docs/go-live.md, Route 1)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # SSH deployment to Hostinger (hPanel → Advanced → SSH Access). The private key is a GitHub secret only.
  deploy-ssh:
    needs: build
    if: needs.build.outputs.ssh_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-65002}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect target and guard against overwriting another site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          TARGET="${SSH_TARGET_DIR:-domains/quietmindsleep.co.uk/public_html}"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" "
            set -e
            echo 'Home:'; pwd; ls -la | head -30
            echo 'Target: $TARGET'; mkdir -p '$TARGET'; cd '$TARGET'; pwd
            COUNT=\$(ls -A | wc -l); echo \"Entries in target: \$COUNT\"; ls -la | head -40
            if [ \"\$COUNT\" -gt 0 ] && [ ! -f .deploy-info ] && [ ! -f index.html ]; then echo 'Target has unknown content and no index.html — refusing'; exit 2; fi
            if [ -f index.html ] && ! grep -q 'Quiet Mind Sleep' index.html; then echo 'Target index.html is not the Quiet Mind Sleep site — refusing to overwrite'; exit 3; fi
            echo 'Guard passed'"
      - name: Sync site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf 'source=%s\nbuilt=%s\n' "${{ github.sha }}" "$(date -u +%FT%TZ)" > dist/.deploy-info
          if ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" 'command -v rsync >/dev/null'; then
            rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-65002}" dist/ "$SSH_USER@$SSH_HOST:$TARGET/"
          else
            tar czf - -C dist . | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" "cd '$TARGET' && find . -mindepth 1 -delete && tar xzf -"
          fi
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" "cd '$TARGET' && echo 'Deployed files:' && find . -type f | wc -l && cat .deploy-info"
      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify:
    needs: deploy-ssh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Snapshot
        run: node scripts/live-snapshot.mjs https://quietmindsleep.co.uk reports-live
      - name: Verify live site
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-live.mjs https://quietmindsleep.co.uk 2>&1 | tee reports-live/verify.log
          rc=${PIPESTATUS[0]}
          cp reports/live-verification.md reports-live/ 2>/dev/null || true
          exit $rc
      - name: Publish results to live-reports branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports-live
          publish_branch: live-reports
          force_orphan: true
          enable_jekyll: false
          commit_message: "Live verification after deploy ${{ github.sha }}"
