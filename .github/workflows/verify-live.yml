name: Verify live site

on:
  schedule:
    - cron: '30 7 * * 1'   # every Monday 07:30 UTC: verify the live site and publish results to the live-reports branch
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to verify
        default: https://quietmindsleep.co.uk
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Snapshot (headers, DNS, TLS, screenshots)
        run: node scripts/live-snapshot.mjs "${{ inputs.url || 'https://quietmindsleep.co.uk' }}" reports-live
      - name: Verify live site
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-live.mjs "${{ inputs.url || 'https://quietmindsleep.co.uk' }}" 2>&1 | tee reports-live/verify.log
          rc=${PIPESTATUS[0]}
          cp reports/live-verification.md reports-live/ 2>/dev/null || true
          exit $rc
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reports
          path: reports-live
      - name: Publish results to live-reports branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports-live
          publish_branch: live-reports
          force_orphan: true
          enable_jekyll: false
          commit_message: "Live verification ${{ inputs.url || 'scheduled' }} ${{ github.run_id }}"
      - name: Result
        run: test "${{ steps.verify.outcome }}" = "success"
